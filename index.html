<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ایلامورا لانج · Ilamaura Lounge</title>
<meta name="description" content="ایلامورا؛ طعم اصالت، رایحه احترام — مجتمع آفتاب ایلام">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&family=Lalezar&family=Fredoka:wght@400;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --g9:#082623;--g8:#0b322e;--g7:#0f3d38;--g5:#1f6b60;
  --gold:#d9aa4e;--gold2:#f4d98f;--cream:#fcf2de;--cream2:#f3e2bf;
  --ink:#2a1812;--blush:#f2a98b;--plum:#3b2559;
  --r:26px;--ease:cubic-bezier(.34,1.56,.64,1);
  --display:'Lalezar','Fredoka',cursive;
}
html[lang=en]{--display:'Fredoka','Lalezar',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#1c1030;color:var(--ink);font-family:'Vazirmatn','Fredoka',system-ui,sans-serif}
html[lang=en] body{font-family:'Fredoka','Vazirmatn',system-ui,sans-serif}
button{font:inherit;color:inherit}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;z-index:1}
canvas#gl.grab{cursor:grabbing}

/* ---------- Sky / background ---------- */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.sky{position:absolute;inset:0;transition:opacity 1.2s ease}
.sky.a{background:linear-gradient(180deg,#3a2a6b 0%,#7d4f8f 36%,#e69a74 76%,#ffd199 100%)}
.sky.b{background:linear-gradient(180deg,#070a26 0%,#1b1850 46%,#3b2559 80%,#6a3a5f 100%);opacity:0}
.sky.m{background:radial-gradient(ellipse at 52% 48%,rgba(255,190,110,.42),transparent 58%),linear-gradient(180deg,rgba(8,38,35,.9),rgba(15,61,56,.82));opacity:0}
body.night .sky.b{opacity:1}
body.mode-menu .sky.m{opacity:1}
.sun,.moon{position:absolute;border-radius:50%;transition:opacity 1.2s,transform 1.6s var(--ease)}
.sun{width:34vmin;height:34vmin;left:6%;top:8%;background:radial-gradient(circle,#fff6cc 0 18%,#ffc16b 38%,rgba(255,160,90,.0) 70%);animation:floaty 7s ease-in-out infinite}
.moon{width:14vmin;height:14vmin;left:12%;top:10%;opacity:0;background:radial-gradient(circle at 35% 35%,#fffbe8,#e9dcb5 60%,#cdbf93);box-shadow:0 0 60px 20px rgba(255,240,200,.25);animation:floaty 8s ease-in-out infinite}
body.night .sun{opacity:0;transform:translateY(40vh)}
body.night .moon{opacity:1}
body.mode-menu .sun{transform:translate(60vw,-6vh) scale(.7);opacity:.55}
body.mode-menu.night .sun{opacity:0}
.stars{position:absolute;inset:0;opacity:0;transition:opacity 1.2s;
  background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 90px 80px,#ffe9b8,transparent),radial-gradient(2px 2px at 160px 20px,#fff,transparent),radial-gradient(1.5px 1.5px at 230px 120px,#fff,transparent),radial-gradient(2px 2px at 300px 60px,#ffe9b8,transparent);
  background-size:320px 160px;animation:twinkle 4s ease-in-out infinite}
body.night .stars{opacity:.9}
.cloud{position:absolute;height:44px;border-radius:44px;background:rgba(255,236,214,.55);filter:blur(1px);animation:drift linear infinite;transition:opacity 1s}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:56px;height:56px;top:-24px;left:22px}.cloud::after{width:40px;height:40px;top:-14px;right:22px}
.cloud.c1{width:150px;top:22%;animation-duration:90s;left:-200px}
.cloud.c2{width:210px;top:36%;animation-duration:140s;left:-300px;animation-delay:-40s}
.cloud.c3{width:120px;top:14%;animation-duration:110s;left:-200px;animation-delay:-70s}
body.night .cloud{opacity:.12}
@keyframes drift{to{transform:translateX(calc(100vw + 500px))}}
@keyframes floaty{50%{transform:translateY(-12px) scale(1.02)}}
@keyframes twinkle{50%{opacity:.5}}

/* ---------- UI shell ---------- */
.ui{position:fixed;inset:0;pointer-events:none;z-index:10}
.card{pointer-events:auto;background:linear-gradient(180deg,#fff8e8,#f7e5c0);border:3px solid var(--ink);border-radius:var(--r);box-shadow:0 7px 0 var(--ink),0 26px 44px rgba(20,8,30,.35)}
.btn{pointer-events:auto;cursor:pointer;border:3px solid var(--ink);background:var(--cream);color:var(--ink);border-radius:999px;padding:.5em 1.15em;font-weight:800;box-shadow:0 4px 0 var(--ink);transition:transform .16s var(--ease),box-shadow .16s,background .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold))}
.btn.big{font-size:1.1rem;padding:.7em 1.5em}
.anchor{position:fixed;pointer-events:none}
#aHero{left:1vw;top:64px;width:56vw;bottom:24px}
#aDock{left:1.2vw;top:96px;width:20vw;bottom:150px}
#aStage{left:22vw;width:38vw;top:74px;bottom:150px}

/* nav */
.nav{position:fixed;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none;z-index:30}
.nav>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer}
.brand canvas{width:48px;height:48px;border-radius:50%;filter:drop-shadow(0 4px 0 rgba(0,0,0,.4));transition:transform .4s var(--ease)}
.brand:hover canvas{transform:rotate(-12deg) scale(1.08)}
.brand-t{display:flex;flex-direction:column;align-items:flex-start;line-height:1;color:#fff4d6;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.brand-t b{font-family:var(--display);font-size:1.5rem;font-weight:400}
.brand-t small{font-family:'Cinzel',serif;letter-spacing:.35em;font-size:.62rem;color:var(--gold2);margin-top:3px}
.tabs{display:flex;padding:5px;gap:4px;border-radius:999px;box-shadow:0 5px 0 var(--ink)}
.tab{border:0;background:transparent;border-radius:999px;padding:.4em 1.1em;font-weight:800;cursor:pointer;transition:background .25s,transform .2s var(--ease)}
.tab:hover{transform:scale(1.05)}
.tab.on{background:var(--g7);color:var(--gold2)}
.tools{display:flex;gap:8px;align-items:center}
.icon-btn,.chip{position:relative;height:44px;min-width:44px;padding:0 12px;border-radius:999px;border:3px solid var(--ink);background:var(--cream);box-shadow:0 4px 0 var(--ink);cursor:pointer;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .16s var(--ease),box-shadow .16s}
.icon-btn:hover,.chip:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.icon-btn:active,.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.chip .bar{width:54px;height:12px;border-radius:8px;background:#fff;border:2px solid var(--ink);overflow:hidden}
.chip .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .6s var(--ease)}
.icon-btn em{position:absolute;top:-8px;inset-inline-end:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--blush);border:2px solid var(--ink);font-style:normal;font-size:.75rem;display:grid;place-items:center;transform:scale(0);transition:transform .3s var(--ease)}
.icon-btn em.has{transform:scale(1)}
.icon-btn.bump{animation:bump .5s var(--ease)}
@keyframes bump{40%{transform:scale(1.25) rotate(-8deg)}}

/* hero card */
.hero-card{position:fixed;right:3vw;top:50%;transform:translateY(-46%);width:min(470px,42vw);max-height:calc(100vh - 130px);overflow:auto;padding:26px 28px;transition:transform .8s var(--ease),opacity .5s}
body.mode-menu .hero-card{transform:translate(80px,-46%) scale(.9);opacity:0;pointer-events:none}
.eyebrow{display:inline-block;background:var(--g7);color:var(--gold2);border-radius:999px;padding:.2em .9em;font-weight:800;font-size:.85rem;border:2px solid var(--ink)}
.hero-card h1{font-family:var(--display);font-weight:400;font-size:clamp(2.8rem,6vw,4.6rem);line-height:1.1;margin:10px 0 0;color:var(--g7);text-shadow:0 4px 0 var(--gold2)}
.tag{font-family:var(--display);font-size:1.35rem;color:#a4631b;margin:2px 0 12px}
.story{line-height:2;font-size:.97rem;color:#4a3328}
.more{display:none;background:none;border:0;color:var(--g5);font-weight:800;cursor:pointer;margin-top:4px}
.badges{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.badges li{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:.25em .8em;font-weight:700;font-size:.85rem;box-shadow:0 3px 0 var(--ink)}
.cta{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hint-mini{font-size:.82rem;color:#7a5b43;font-weight:600}
.btn.big.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:translateY(-3px) scale(1.04)}}

/* detail card */
.detail{position:fixed;right:2vw;top:78px;bottom:132px;width:min(410px,34vw);padding:20px 22px;overflow:auto;transform:translateX(120%);opacity:0;transition:transform .8s var(--ease) .1s,opacity .4s .1s}
body.mode-menu .detail{transform:none;opacity:1}
.d-top{display:flex;justify-content:space-between;align-items:center}
.chip-cat{background:var(--g7);color:var(--gold2);padding:.15em .8em;border-radius:999px;font-weight:800;font-size:.8rem;border:2px solid var(--ink)}
.rate{font-weight:800}
.detail h2{font-family:var(--display);font-weight:400;font-size:2rem;line-height:1.2;margin-top:8px;color:var(--g7)}
.detail .sub{font-size:.85rem;color:#8a6a50;font-weight:600;margin-bottom:6px}
.desc{line-height:1.9;font-size:.93rem;color:#4a3328}
.stats{margin:12px 0 6px;display:grid;gap:6px}
.stat{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.85rem}
.pips i{width:15px;height:15px;border-radius:5px;border:2px solid var(--ink);background:#fff;display:inline-block;margin-inline-start:3px}
.pips i.on{background:linear-gradient(180deg,var(--gold2),var(--gold));animation:pop .5s var(--ease) both;animation-delay:var(--d)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.meta{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.meta span{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:.15em .7em;font-weight:700;font-size:.82rem}
.detail h3{font-size:.82rem;letter-spacing:.04em;color:#8a6a50;margin:12px 0 6px;font-weight:800}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{border:3px solid var(--ink);background:#fff;border-radius:16px;padding:.45em .2em;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.3;box-shadow:0 3px 0 var(--ink);transition:transform .18s var(--ease),background .2s}
.seg button b{font-size:.9rem}.seg button small{font-size:.72rem;color:#7a5b43;font-weight:700}
.seg button:hover{transform:translateY(-2px)}
.seg button.on{background:linear-gradient(180deg,var(--gold2),var(--gold));transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .x{border:3px solid var(--ink);background:#fff;border-radius:999px;padding:.25em .85em;cursor:pointer;font-weight:700;font-size:.82rem;transition:transform .18s var(--ease),background .2s}
.chips .x small{color:#7a5b43}
.chips .x:hover{transform:scale(1.05)}
.chips .x.on{background:var(--g7);color:var(--gold2)}.chips .x.on small{color:var(--gold2)}
.buy{display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:14px;border-top:3px dashed rgba(42,24,18,.25);flex-wrap:wrap}
.qty{display:flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:2px}
.qty button{width:30px;height:30px;border-radius:50%;border:0;background:var(--cream2);font-weight:800;cursor:pointer;transition:transform .15s var(--ease)}
.qty button:active{transform:scale(.85)}
.qty b{min-width:22px;text-align:center}
.price{display:flex;flex-direction:column;line-height:1.1;margin-inline-end:auto}
.price small{font-size:.7rem;color:#8a6a50;font-weight:700}
.price b{font-family:var(--display);font-weight:400;font-size:1.7rem;color:var(--g7)}
.price u{text-decoration:none;font-size:.72rem;font-weight:700;color:#8a6a50}

/* dock */
.dock{position:fixed;left:50%;bottom:14px;transform:translate(-50%,160%);display:flex;gap:10px;padding:10px 12px;background:rgba(255,247,230,.94);border:3px solid var(--ink);border-radius:32px;box-shadow:0 6px 0 var(--ink),0 20px 40px rgba(0,0,0,.35);pointer-events:auto;transition:transform .8s var(--ease) .15s;max-width:96vw;z-index:20}
body.mode-menu .dock{transform:translate(-50%,0)}
.thumb{width:84px;border:3px solid var(--ink);border-radius:22px;background:linear-gradient(180deg,#fff,#f4e4c4);padding:2px 2px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;box-shadow:0 3px 0 var(--ink);transition:transform .25s var(--ease),background .2s;flex:0 0 auto}
.thumb canvas{width:100%;aspect-ratio:1;display:block}
.thumb span{font-size:.68rem;font-weight:800;line-height:1.2;text-align:center;padding:0 2px;height:2.4em;display:flex;align-items:center}
.thumb:hover{transform:translateY(-5px)}
.thumb.on{transform:translateY(-10px) scale(1.07);background:linear-gradient(180deg,var(--gold2),var(--gold))}
#dockBack{position:fixed;left:1.2vw;top:96px;width:20vw;bottom:150px;pointer-events:none;border-radius:30px;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;z-index:12;background:none;border:0}
body.mode-menu #dockBack{pointer-events:auto}
#dockBack span{opacity:0;transform:translateY(10px);transition:.3s var(--ease);background:var(--cream);border:3px solid var(--ink);border-radius:999px;padding:.2em .9em;font-weight:800;font-size:.8rem;box-shadow:0 3px 0 var(--ink)}
#dockBack:hover span,#dockBack:focus-visible span{opacity:1;transform:none}
.stage-hint{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;opacity:0;transition:opacity .5s}
body.mode-menu .stage-hint{opacity:1}
.stage-hint span{background:rgba(255,247,230,.92);border:3px solid var(--ink);border-radius:999px;padding:.2em 1em;font-weight:800;font-size:.85rem;box-shadow:0 3px 0 var(--ink);animation:nudge 2s ease-in-out infinite}
.stage-hint.gone{opacity:0!important}
@keyframes nudge{50%{transform:translateX(8px)}}

/* tray + quests */
.panel{position:fixed;top:70px;inset-inline-start:14px;width:min(350px,92vw);padding:18px;transform:scale(.8) translateY(-10px);transform-origin:top left;opacity:0;pointer-events:none;transition:transform .35s var(--ease),opacity .2s;z-index:40}
html[dir=rtl] .panel{transform-origin:top right}
.panel.open{transform:none;opacity:1;pointer-events:auto}
.panel h4{font-family:var(--display);font-weight:400;font-size:1.4rem;color:var(--g7);margin-bottom:8px}
.q{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#fff;border:2px solid var(--ink);border-radius:14px;margin-bottom:8px;font-weight:700;font-size:.88rem;transition:background .3s}
.q .ck{width:26px;height:26px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;flex:0 0 auto;background:#fff;font-size:.8rem}
.q.done{background:#e7f6d8}.q.done .ck{background:var(--gold)}
.q small{margin-inline-start:auto;color:#7a5b43}
.tr-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:2px dashed rgba(42,24,18,.2);font-weight:700;font-size:.88rem}
.tr-row small{display:block;color:#7a5b43;font-weight:600}
.tr-row .rm{margin-inline-start:auto;border:0;background:none;cursor:pointer;font-size:1rem}
.tr-total{display:flex;justify-content:space-between;font-weight:800;margin:12px 0;font-size:1.05rem}
.empty{text-align:center;padding:14px 0;color:#7a5b43;font-weight:700}
.toasts{position:fixed;top:72px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:60;pointer-events:none}
.toast{background:var(--g7);color:var(--gold2);border:3px solid var(--ink);border-radius:999px;padding:.3em 1.1em;font-weight:800;box-shadow:0 4px 0 var(--ink);animation:toastIn .5s var(--ease),toastOut .4s 2.2s forwards}
@keyframes toastIn{from{transform:translateY(-20px) scale(.6);opacity:0}}
@keyframes toastOut{to{transform:translateY(-14px);opacity:0}}
.confetti{position:fixed;width:10px;height:10px;border-radius:3px;pointer-events:none;z-index:70}
.fly{position:fixed;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff3c4,var(--gold));border:3px solid var(--ink);z-index:70;pointer-events:none}
#loader{position:fixed;inset:0;background:var(--g8);display:grid;place-items:center;z-index:100;transition:opacity .8s,visibility .8s}
#loader div{text-align:center;color:var(--gold2);font-family:'Cinzel',serif;letter-spacing:.3em}
#loader canvas{width:110px;height:110px;animation:spin 2.2s linear infinite}
@keyframes spin{to{transform:rotateY(360deg)}}
body.loaded #loader{opacity:0;visibility:hidden}
.fatal{position:fixed;inset:0;display:grid;place-items:center;background:var(--g8);color:var(--gold2);z-index:200;padding:30px;text-align:center}

/* ---------- Mobile ---------- */
@media (max-width:820px){
  #aHero{left:0;right:0;width:auto;top:64px;height:42vh;bottom:auto}
  #aDock{left:6px;top:62px;width:92px;height:92px;bottom:auto}
  #aStage{left:0;right:0;width:auto;top:66px;height:36vh;bottom:auto}
  #dockBack{left:6px;top:62px;width:92px;height:92px;bottom:auto}
  #dockBack span{display:none}
  .brand-t,.tab-long{display:none}
  .nav{top:8px;left:8px;right:8px}
  .chip .bar{width:34px}
  .tools{gap:6px}.icon-btn,.chip{height:40px;min-width:40px;padding:0 9px}
  .hero-card{right:12px;left:12px;width:auto;top:auto;bottom:12px;transform:none;max-height:46vh;padding:18px 18px}
  body.mode-menu .hero-card{transform:translateY(120%)}
  .story{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .story.open{-webkit-line-clamp:unset;display:block}
  .more{display:inline-block}
  .detail{left:10px;right:10px;width:auto;top:auto;bottom:98px;max-height:40vh;padding:14px 16px}
  .detail h2{font-size:1.5rem}
  .dock{bottom:8px;gap:7px;padding:7px 8px;overflow-x:auto}
  .thumb{width:68px}
  .panel{inset-inline-start:10px}
}
@media (prefers-reduced-motion:reduce){.sun,.moon,.cloud,.stars,.btn.big.pulse,.stage-hint span{animation:none}}
</style>
</head>
<body class="mode-hero">
<div id="loader"><div><canvas id="loadLogo" width="220" height="220"></canvas><p style="margin-top:14px;font-size:.8rem">ILAMAURA</p></div></div>

<div id="bg">
  <div class="sky a"></div><div class="sky b"></div><div class="sky m"></div>
  <div class="stars"></div><div class="sun"></div><div class="moon"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
</div>
<canvas id="gl"></canvas>

<div class="ui">
  <div class="anchor" id="aHero"></div>
  <div class="anchor" id="aDock"></div>
  <div class="anchor" id="aStage"><div class="stage-hint" id="stageHint"><span id="hintTxt"></span></div></div>

  <header class="nav">
    <button class="brand" id="brandBtn" aria-label="Ilamaura"><canvas id="navLogo" width="96" height="96"></canvas><span class="brand-t"><b data-i="brand"></b><small>LOUNGE</small></span></button>
    <div class="tabs card" role="tablist">
      <button class="tab on" data-go="hero" data-i="nav_home" role="tab"></button>
      <button class="tab" data-go="menu" data-i="nav_menu" role="tab"></button>
    </div>
    <div class="tools">
      <button class="chip" id="auraBtn" aria-label="Quests"><span>⭐ <b id="lvNum">1</b></span><span class="bar"><i id="lvBar"></i></span><span id="ptsTxt">0</span></button>
      <button class="icon-btn" id="trayBtn" aria-label="Tray">🧺<em id="trayCount">0</em></button>
      <button class="icon-btn" id="nightBtn" aria-label="Day / Night">🌙</button>
      <button class="icon-btn" id="soundBtn" aria-label="Sound">🔇</button>
      <button class="icon-btn" id="langBtn" aria-label="Language">EN</button>
    </div>
  </header>

  <section class="card hero-card" id="heroCard">
    <span class="eyebrow">📍 <span data-i="eyebrow"></span></span>
    <h1 data-i="title"></h1>
    <p class="tag" data-i="tag"></p>
    <p class="story" id="story" data-i="story"></p>
    <button class="more" id="moreBtn"></button>

}
$('#detail').addEventListener('click',e=>{
  const s=e.target.closest('[data-s]'),x=e.target.closest('[data-x]'),q=e.target.closest('[data-q]'),a=e.target.closest('#addBtn');
  if(s){state.size=+s.dataset.s;springs.size.target=sizeObj().s;springs.size.vel+=1.2;$$('[data-s]').forEach(b=>b.classList.toggle('on',+b.dataset.s===state.size));sPop()}
  else if(x){const i=+x.dataset.x;state.extras.has(i)?state.extras.delete(i):state.extras.add(i);x.classList.toggle('on',state.extras.has(i));springs.extra.vel+=8;sPop();
    const r=x.getBoundingClientRect();if(state.extras.has(i))confetti(r.left+r.width/2,r.top,6)}
  else if(q){state.qty=clamp(state.qty+ +q.dataset.q,1,20);$('#qtyN').textContent=nf(state.qty);sPop()}
  else if(a){addToTray(a)}
  priceTarget=unitPrice()*state.qty;
});

function selectItem(i){
  if(i===state.sel&&state.shown===i)return;
  state.sel=i;state.size=1;state.extras.clear();state.qty=1;springs.size.v=springs.size.t=ITEMS[i].sizes[1].s;
  item.vel+=7;sPop();game.cats.add(ITEMS[i].cat);
  $$('.thumb').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));renderDetail();updateAura();checkQuests();
}

/* ---------- tray ---------- */
function addToTray(btn){
  const it=ITEMS[state.sel],key=[it.id,state.size,[...state.extras].sort().join(',')].join('|');
  const ex=state.tray.find(t=>t.key===key);
  if(ex)ex.qty+=state.qty;else state.tray.push({key,id:it.id,size:state.size,extras:[...state.extras],qty:state.qty});
  game.added++;
  const from=btn.getBoundingClientRect(),to=$('#trayBtn').getBoundingClientRect();
  const f=document.createElement('div');f.className='fly';document.body.appendChild(f);
  f.animate([{transform:`translate(${from.left+from.width/2}px,${from.top}px) scale(1)`},{transform:`translate(${(from.left+to.left)/2}px,${from.top-120}px) scale(1.3)`,offset:.45},{transform:`translate(${to.left+to.width/2-11}px,${to.top+10}px) scale(.3)`}],{duration:750,easing:'ease-in-out'}).onfinish=()=>{f.remove();$('#trayBtn').classList.remove('bump');void $('#trayBtn').offsetWidth;$('#trayBtn').classList.add('bump')};
  f.style.left='0';f.style.top='0';
  sCoin();toast('🧺 '+it.name[state.lang]+' · '+tr('added'));addPoints(15,from.left+from.width/2,from.top);renderTray();
}
function trayTotal(){return state.tray.reduce((s,t)=>{const it=ITEMS.find(x=>x.id===t.id);let p=it.sizes[t.size].p;t.extras.forEach(i=>p+=it.extras[i].p);return s+p*t.qty},0)}
function renderTray(){
  const n=state.tray.reduce((s,t)=>s+t.qty,0),em=$('#trayCount');em.textContent=nf(n);em.classList.toggle('has',n>0);
  const lg=state.lang;
  $('#trayList').innerHTML=state.tray.length?state.tray.map((t,i)=>{const it=ITEMS.find(x=>x.id===t.id);return `<div class="tr-row"><span>${it.emo}</span><div>${it.name[lg]}<small>${it.sizes[t.size].n[lg]} × ${nf(t.qty)}${t.extras.length?' · '+t.extras.map(e=>it.extras[e].n[lg]).join('، '):''}</small></div><button class="rm" data-rm="${i}" aria-label="remove">✕</button></div>`}).join('')
    +`<div class="tr-total"><span>${tr('total')}</span><span>${nf(trayTotal())} ${tr('cur')}</span></div><button class="btn gold" id="resBtn" style="width:100%">${tr('reserve')}</button>`
    :`<div class="empty">${tr('empty')}</div>`;
}
$('#trayList').addEventListener('click',e=>{
  const r=e.target.closest('[data-rm]');if(r){state.tray.splice(+r.dataset.rm,1);renderTray();sPop()}
  if(e.target.closest('#resBtn')){toast(tr('reserved'));sWin();confetti(innerWidth/2,200,30);state.tray=[];renderTray();$('#trayPanel').classList.remove('open')}
});

/* ---------- mode & chrome ---------- */
function setMode(m){
  if(state.mode===m)return;state.mode=m;
  document.body.classList.toggle('mode-menu',m==='menu');document.body.classList.toggle('mode-hero',m==='hero');
  $$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.go===m));
  $('#trayPanel').classList.remove('open');$('#questPanel').classList.remove('open');
  if(m==='menu'){state.shown=-1;game.cats.add(ITEMS[state.sel].cat);renderDetail();updateAura();checkQuests()}
  sPop();
}
$$('.tab').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.go)));
$('#enterBtn').addEventListener('click',()=>setMode('menu'));
$('#brandBtn').addEventListener('click',()=>setMode('hero'));
$('#dockBack').addEventListener('click',()=>setMode('hero'));
$('#auraBtn').addEventListener('click',()=>{$('#trayPanel').classList.remove('open');$('#questPanel').classList.toggle('open');renderQuests()});
$('#trayBtn').addEventListener('click',()=>{$('#questPanel').classList.remove('open');$('#trayPanel').classList.toggle('open');renderTray()});
$('#nightBtn').addEventListener('click',()=>{state.night=!state.night;document.body.classList.toggle('night',state.night);$('#nightBtn').textContent=state.night?'☀️':'🌙';sPop()});
$('#soundBtn').addEventListener('click',()=>{state.sound=!state.sound;$('#soundBtn').textContent=state.sound?'🔊':'🔇';sPop()});
$('#langBtn').addEventListener('click',()=>{state.lang=state.lang==='fa'?'en':'fa';applyLang();sPop()});
$('#moreBtn').addEventListener('click',()=>{const s=$('#story');s.classList.toggle('open');$('#moreBtn').textContent=s.classList.contains('open')?tr('less'):tr('more')});
document.addEventListener('click',e=>{if(!e.target.closest('.panel,#auraBtn,#trayBtn,.fly')){$('#trayPanel').classList.remove('open');$('#questPanel').classList.remove('open')}});
addEventListener('keydown',e=>{
  if(e.key==='Escape')setMode('hero');
  else if(state.mode==='menu'&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){const dir=(e.key==='ArrowRight')===(state.lang==='en')?1:-1;selectItem((state.sel+dir+ITEMS.length)%ITEMS.length)}
  else if(state.mode==='hero'&&e.key==='Enter'&&document.activeElement===document.body)setMode('menu');
});
function applyLang(){
  const lg=state.lang;document.documentElement.lang=lg;document.documentElement.dir=lg==='fa'?'rtl':'ltr';
  $$('[data-i]').forEach(el=>el.textContent=tr(el.dataset.i));
  $('#langBtn').textContent=lg==='fa'?'EN':'فا';document.title=lg==='fa'?'ایلامورا لانج · Ilamaura Lounge':'Ilamaura Lounge · ایلامورا';
  $('#moreBtn').textContent=$('#story').classList.contains('open')?tr('less'):tr('more');
  renderDock();renderDetail();renderTray();renderQuests();updateAura();
}

/* =====================================================================
   FRAME LOOP
===================================================================== */
const vTmp=new THREE.Vector3();
const C_SKY_D=new THREE.Color(0xfff0dc),C_SKY_N=new THREE.Color(0x6a62c8),C_GR_D=new THREE.Color(0x8a6fa0),C_GR_N=new THREE.Color(0x2a2260),C_SUN_D=new THREE.Color(0xffe2bd),C_SUN_N=new THREE.Color(0x8ea2ff);
let nightV=0,T=0,last=performance.now(),lastQuest=0;

function update(dt){
  T+=dt;
  springs.dock.target=state.mode==='menu'?1:0;springs.menu.target=state.mode==='menu'?1:0;
  const d=springs.dock.step(dt),mi=springs.menu.step(dt);

  // night blend
  nightV+=((state.night?1:0)-nightV)*Math.min(1,dt*3);
  hHemi.color.lerpColors(C_SKY_D,C_SKY_N,nightV);hHemi.groundColor.lerpColors(C_GR_D,C_GR_N,nightV);hHemi.intensity=lerp(.4,.36,nightV);
  hSun.color.lerpColors(C_SUN_D,C_SUN_N,nightV);hSun.intensity=lerp(.6,.32,nightV);
  H.lamps.forEach(l=>l.intensity=lerp(l.userData.b||(l.userData.b=l.intensity),l.userData.b*1.7,nightV));
  H.win.forEach(m=>m.color.setScalar(lerp(.78,1,nightV)));
  H.bulbs.forEach(m=>m.color.setRGB(1,lerp(.84,.9,nightV),lerp(.54,.62,nightV)));
  mHemi.color.lerpColors(C_SKY_D,C_SKY_N,nightV*.6);mKey.intensity=lerp(.55,.42,nightV);

  // ----- hero placement -----
  const a=rects.hero,b=rects.dock,k=d;
  const ax=lerp(a.x+a.w/2,b.x+b.w/2,k),ay=lerp(a.y+a.h/2,b.y+b.h/2,k),aw=lerp(a.w,b.w,k),ah=lerp(a.h,b.h,k);
  const upp=FH/H_,s=Math.max(.05,Math.min(aw*upp/HB.w,ah*upp/HB.h));
  heroRoot.scale.setScalar(s);
  heroRoot.position.set(0,0,0).addScaledVector(camR,(ax-W/2)*upp-s*HB.cR).addScaledVector(camU,-(ay-H_/2)*upp-s*HB.cU);

  // hero spin/yaw
  if(!drag.on||state.mode!=='hero'){hero.idle+=dt;hero.yaw+=hero.vel*dt;hero.vel*=Math.exp(-dt*2.4);
    if(hero.idle>2.2){const home=Math.round(hero.yaw/(PI*2))*PI*2;hero.yaw+=(home-hero.yaw)*Math.min(1,dt*1.6)}}
  heroSpin.rotation.y=hero.yaw+(REDUCED?0:Math.sin(T*.35)*.07)+(pointer.x-.5)*.18;
  heroSpin.position.y=REDUCED?0:Math.sin(T*.9)*.1;
  H.sign.rotation.y=PI/4-heroSpin.rotation.y;
  H.rays.rotation.z=T*.4;
  H.people.forEach(p=>{p.g.position.y=p.by+Math.abs(Math.sin(T*2.2+p.ph))*.06;p.g.rotation.y=Math.sin(T*.8+p.ph)*.5+PI/4;if(p.wave)p.arm.rotation.z=Math.sin(T*6)*.6});
  H.smoke.forEach(s2=>{const p=(T*.25+s2.ph)%1;s2.m.position.set(s2.bx+Math.sin(T+s2.ph*7)*.15,s2.by+p*2.2,s2.bz);s2.m.scale.setScalar(.5+p*1.4);s2.m.material.opacity=.5*(1-p)});
  H.coins.forEach(c=>{if(c.userData.gone){c.userData.pop=Math.max(0,c.userData.pop-dt*3);c.scale.setScalar(1+(1-c.userData.pop)*1.5);c.position.y+=dt*3;if(c.userData.pop<=0)c.visible=false;c.traverse(o=>{if(o.material&&o.material.transparent!==undefined){}})}
    else{c.rotation.y=T*2.2+c.userData.ph;c.position.y=c.userData.base+Math.sin(T*1.6+c.userData.ph)*.2}});
  H.firefly.rotation.y=T*.03;H.firefly.material.opacity=.7+Math.sin(T*2)*.3;

  // ----- menu -----
  const menuOn=mi>.015;menuRoot.visible=menuOn;
  if(menuOn){
    menuRoot.scale.setScalar(Math.max(.001,menuFit.s*Math.max(mi,0)));
    if(state.mode==='menu'){
      if(!drag.on){item.rot+=item.vel*dt;item.vel+=((REDUCED?0:.55)-item.vel)*Math.min(1,dt*1.6)}
      if(state.shown!==state.sel){
        springs.pop.target=0;
        if(springs.pop.v<.1){if(state.shown>=0)ITEMS[state.shown].obj.visible=false;state.shown=state.sel;ITEMS[state.shown].obj.visible=true;springs.pop.target=1;springs.size.v=springs.size.t=sizeObj().s;item.vel+=4}
      }else springs.pop.target=1;
    }
    springs.pop.step(dt);springs.size.step(dt);springs.extra.step(dt);
    itemSpin.rotation.y=item.rot;
    if(state.shown>=0){const o=ITEMS[state.shown].obj;
      o.scale.setScalar(o.userData.fit*springs.size.v*Math.max(springs.pop.v,.0001)*(1+springs.extra.v*.02));
      o.position.y=Math.sin(T*1.5)*.04;if(o.userData.anim)o.userData.anim(T)}
    glowM.opacity=.8+Math.sin(T*2)*.15;mSpark.rotation.y=T*.12;mSpark.position.y=Math.sin(T)*.08;
  }
  // price count-up
  if(Math.abs(priceShown-priceTarget)>.5){priceShown+=(priceTarget-priceShown)*Math.min(1,dt*9);const el=$('#priceTxt');if(el)el.textContent=nf(Math.round(priceShown/1000)*1000===Math.round(priceTarget/1000)*1000&&Math.abs(priceShown-priceTarget)<1500?priceTarget:Math.round(priceShown/500)*500)}
  else if(priceShown!==priceTarget){priceShown=priceTarget;const el=$('#priceTxt');if(el)el.textContent=nf(priceTarget)}
}
function render(){
  renderer.setScissorTest(false);renderer.setViewport(0,0,W,H_);renderer.clear(true,true,true);
  renderer.render(heroScene,heroCam);
  if(menuRoot.visible){renderer.clearDepth();renderer.render(menuScene,menuCam)}
}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(frame)}

/* =====================================================================
   BOOT
===================================================================== */
onResize();
drawNavLogos();
applyLang();
try{bakeThumbs()}catch(e){}
renderDock();
springs.dock.v=0;
requestAnimationFrame(t=>{last=t;frame(t);setTimeout(()=>document.body.classList.add('loaded'),500)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{redraws.forEach(f=>f());drawNavLogos()});
})();
</script>
</body>
